{% extends "base.html" %}

{% block content %}

<div class="container-fluid">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2>Change Password</h2>

            <p class="text-muted">
                Change your account password
            </p>

        </div>


        <a
            href="{% url 'settings' %}"
            class="btn btn-secondary"
        >

            <i class="bi bi-arrow-left"></i>

            Back to Settings

        </a>

    </div>


    {% if messages %}

        {% for message in messages %}

            <div class="alert alert-{{ message.tags }}">

                {{ message }}

            </div>

        {% endfor %}

    {% endif %}


    <div class="card shadow-sm">

        <div class="card-body">

            <form
                method="POST"
                action="{% url 'change_password' %}"
            >

                {% csrf_token %}


                <!-- CURRENT PASSWORD -->

                <div class="mb-3">

                    <label class="form-label">
                        Current Password
                    </label>

                    <input
                        type="password"
                        name="current_password"
                        class="form-control"
                        placeholder="Enter current password"
                        required
                    >

                </div>


                <!-- NEW PASSWORD -->

                <div class="mb-3">

                    <label class="form-label">
                        New Password
                    </label>

                    <input
                        type="password"
                        name="new_password"
                        class="form-control"
                        placeholder="Enter new password"
                        minlength="8"
                        required
                    >

                    <small class="text-muted">
                        Minimum 8 characters.
                    </small>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="mb-3">

                    <label class="form-label">
                        Confirm New Password
                    </label>

                    <input
                        type="password"
                        name="confirm_password"
                        class="form-control"
                        placeholder="Confirm new password"
                        minlength="8"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-warning"
                >

                    <i class="bi bi-key"></i>

                    Change Password

                </button>


                <a
                    href="{% url 'settings' %}"
                    class="btn btn-secondary ms-2"
                >

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
